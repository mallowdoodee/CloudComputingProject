<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Auth Page
      {% endblock %}
    </title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      label {
        user-select: none;
        -webkit-user-select: none;
        cursor: pointer;
      }
      .no-select {
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-blue-800 text-white shadow-md no-select">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          {% comment %} <a href="/stitch/template/" class="text-xl font-semibold">Welcome</a> {% endcomment %}
          <div class="flex items-center gap-8">
          <a href="{% url 'appointment-list' %}" class="flex items-center gap-2 group">
            <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-600 rounded-lg flex items-center justify-center shadow-md group-hover:shadow-lg transition-all duration-300 group-hover:scale-105">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
              </svg>
            </div>
            <span class="text-xl font-bold bg-gradient-to-r from-sky-50 to-sky-50 bg-clip-text text-transparent">Health Record</span>
          </a>
        </div>
          <div class="flex items-center space-x-6">
            {% block navbar %}
                {% if user.is_authenticated %}
                <p class="text-gray-300">
                    Hi, <span class="font-medium text-white">{{ user.username }}</span>
                </p>
                <a href="{% url 'logout' %}" class="text-sky-50 hover:text-sky-50 font-semibold transition-all duration-300 ease-out hover:text-red-500 hover:underline hover:scale-105 hover:-translate-y-0.5">Logout</a>
                {% else %}
                <a href="{% url 'login' %}" class="text-sky-50 hover:text-sky-50 font-semibold transition-all duration-300 ease-out hover:underline hover:scale-105 hover:-translate-y-0.5">Log In</a>
                {% endif %}
            {% endblock navbar %}
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-10 bg-gray-100">
      {% block content %}
      {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 text-center py-4 no-select">
      <p class="text-sm">&copy; 2025 Health Record. All rights reserved.</p>
    </footer>
  </body>
</html>
